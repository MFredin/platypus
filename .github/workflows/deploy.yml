name: Deploy Daybreak (Node 24)
run-name: Daybreak Pages · Node 24 · ${{ github.sha }}

on:
  push:
    branches: [main, work]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5 actions run on the Node 24 action runtime. Older major versions
      # emit Node 20 deprecation warnings on current GitHub-hosted runners.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify workflow revision
        run: |
          node --version
          test -f package-lock.json
          git rev-parse HEAD
          npm pkg get scripts.build
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
